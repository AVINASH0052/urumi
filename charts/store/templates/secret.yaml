{{- if not .Values.existingSecret }}
{{- /* Generate once, then reuse via lookup so upgrades never rotate DB passwords. */}}
{{- $name := include "store.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # survives uninstall, so a retained DB volume stays usable
type: Opaque
data:
  MARIADB_ROOT_PASSWORD: {{ get $old "MARIADB_ROOT_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
  MARIADB_PASSWORD: {{ get $old "MARIADB_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
  WP_ADMIN_PASSWORD: {{ get $old "WP_ADMIN_PASSWORD" | default (randAlphaNum 20 | b64enc) }}
  WC_CONSUMER_KEY: {{ get $old "WC_CONSUMER_KEY" | default (printf "ck_%s" (randAlphaNum 40 | lower) | b64enc) }}
  WC_CONSUMER_SECRET: {{ get $old "WC_CONSUMER_SECRET" | default (printf "cs_%s" (randAlphaNum 40 | lower) | b64enc) }}
  WOO_MCP_TOKEN: {{ get $old "WOO_MCP_TOKEN" | default (randAlphaNum 40 | b64enc) }}   # gateway -> woo-mcp static bearer
{{- end }}
