{{- if .Values.networkPolicy.enabled }}
{{- $rel := .Release.Name }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $rel }}-platform-default-deny
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform
      app.kubernetes.io/instance: {{ $rel }}
  policyTypes: [Ingress]
---
# Gateway: public via the ingress controller only. Egress anywhere (remote MCP servers, LLM API)
# except the cloud metadata endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $rel }}-gateway
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "platform.selector" (list . "gateway") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressController.namespace }}
          podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
      ports:
        - port: 3000
  egress:
    - to:
        - namespaceSelector: {}      # in-cluster pods (upstreams, Postgres, DNS); ipBlock may not cover pod IPs
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
---
# Postgres and the in-cluster upstreams: the gateway is the only client.
{{- range $c := list (dict "name" "postgres" "port" 5432) (dict "name" "utils-mcp" "port" 3000) (dict "name" "everything-mcp" "port" 3001) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $rel }}-{{ $c.name }}
  labels: {{- include "platform.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "platform.selector" (list $ $c.name) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "platform.selector" (list $ "gateway") | nindent 14 }}
      ports:
        - port: {{ $c.port }}
  egress:   # none of these need the network, beyond DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
{{- end }}
{{- end }}
