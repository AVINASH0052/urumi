{{- if not .Values.existingSecret }}
{{- $name := include "platform.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # CREDENTIALS_KEY must survive: it decrypts stored upstream credentials
type: Opaque
data:
  POSTGRES_PASSWORD: {{ get $old "POSTGRES_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
  SESSION_SECRET: {{ get $old "SESSION_SECRET" | default (randAlphaNum 48 | b64enc) }}
  CREDENTIALS_KEY: {{ get $old "CREDENTIALS_KEY" | default (randAlphaNum 32 | b64enc | b64enc) }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ get $old "BOOTSTRAP_ADMIN_PASSWORD" | default (randAlphaNum 16 | b64enc) }}
  UTILS_MCP_TOKEN: {{ get $old "UTILS_MCP_TOKEN" | default (randAlphaNum 40 | b64enc) }}
  LLM_API_KEY: {{ .Values.gateway.llm.apiKey | default (get $old "LLM_API_KEY" | default "" | b64dec) | b64enc }}
{{- end }}
