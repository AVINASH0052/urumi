# k3d = k3s in Docker. Same distro as the VPS: Traefik ingress, local-path storage
# and the embedded NetworkPolicy controller all behave identically.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: urumi
servers: 1
agents: 0
ports:
  - port: 80:80
    nodeFilters: [loadbalancer]
  - port: 443:443
    nodeFilters: [loadbalancer]
